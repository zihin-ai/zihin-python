name: Publish to PyPI

# Runs when a GitHub Release is published. Uses PyPI Trusted Publishing: no API token is stored.
# One-time setup on pypi.org: add a (pending) trusted publisher for this repository with
# workflow `publish.yml` and environment `pypi`.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" build
      - run: pytest
      - name: Check that the release tag matches the package version
        run: |
          version="$(python -c 'import zihin; print(zihin.__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
