[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zihin"
version = "0.1.0"
description = "Official Python client for invoking Zihin.ai hosted AI agents (buffered and streaming calls)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Zihin" }]
keywords = ["zihin", "ai-agents", "agent-sdk", "llm", "sse", "streaming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://zihin.ai"
Documentation = "https://docs.zihin.ai"
Repository = "https://github.com/zihin-ai/zihin-python"
Issues = "https://github.com/zihin-ai/zihin-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zihin"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
